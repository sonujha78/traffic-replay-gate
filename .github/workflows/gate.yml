name: release-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the gate
        run: go build -o bin/gate ./cmd/gate

      # In a real project the candidate is built from the pull request's own code.
      # Here the demo service picks its behaviour from demo/candidate-version.txt.
      - name: Start the candidate
        run: |
          export APP_VERSION="$(tr -d '[:space:]' < demo/candidate-version.txt)"
          echo "candidate version: $APP_VERSION"
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS localhost:18000/health && break
            sleep 2
          done
          curl -fsS localhost:18000/health

      - name: Replay the golden set
        run: |
          ./bin/gate replay \
            --target http://localhost:18000 \
            --golden golden/shop-api-v1.jsonl \
            --header "Authorization=Bearer demo-token-123"

      - name: Comment the report on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'reports/out/report.md';
            if (!fs.existsSync(file)) return;
            const marker = '<!-- traffic-replay-gate -->';
            let body = marker + '\n' + fs.readFileSync(file, 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n_Report truncated._';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: reports/out/
          if-no-files-found: ignore

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=50
